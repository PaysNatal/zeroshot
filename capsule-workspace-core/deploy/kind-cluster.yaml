# 3-node cluster: 1 control-plane + 2 workers. Two workers so per-node cache scoping is real — pods
# co-scheduled on one worker share that node's hostPath cache; pods on different workers must not.
# Each kind "node" is its own container, so a hostPath is genuinely per-node (this is the property that
# would pass falsely on a single-node cluster).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nodeplane
nodes:
  - role: control-plane
  - role: worker
  - role: worker
